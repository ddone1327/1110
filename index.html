<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>SKY ARCADE</title>
<style>
  html,body{margin:0;height:100%;background:#04050c;overflow:hidden;touch-action:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,#10183a 0%,#04050c 70%)}
  canvas{display:block;box-shadow:0 0 80px rgba(80,160,255,.35),0 0 0 1px rgba(120,180,255,.25);cursor:crosshair;background:#000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 600, H = 900;
let K = 1;
function resize(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  K = s * Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * K); cv.height = Math.round(H * K);
}
addEventListener('resize', resize); resize();

/* ---------- utils ---------- */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const easeOut = u => 1 - Math.pow(1 - u, 3);
const easeBack = u => { const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };

/* ---------- audio ---------- */
let AC = null, muted = false;
function initAudio(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function snd(type, f0, f1, dur, vol){
  if (!AC || muted) return;
  const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g).connect(AC.destination); o.start(); o.stop(t0 + dur);
}
function noise(dur, vol, f){
  if (!AC || muted) return;
  const n = AC.sampleRate * dur | 0, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(); s.buffer = b;
  const fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = f;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(fl).connect(g).connect(AC.destination); s.start();
}
let lastShot = 0;
const sfx = {
  shoot(){ const n = performance.now(); if (n - lastShot < 70) return; lastShot = n; snd('square', 900, 350, .06, .018); },
  missile(){ snd('sawtooth', 300, 80, .35, .05); noise(.3, .06, 1500); },
  boom(s = 1){ noise(.4 + .3 * s, .18 * Math.min(s, 1.5), 900 + 300 * s); snd('sine', 140, 30, .4, .15); },
  hit(){ snd('square', 220, 90, .1, .03); },
  hurt(){ noise(.35, .25, 600); snd('sawtooth', 200, 40, .4, .12); },
  pick(){ [660, 880, 1320].forEach((f, i) => setTimeout(() => snd('triangle', f, f * 1.02, .12, .07), i * 55)); },
  roll(){ noise(.35, .1, 3500); snd('sine', 300, 1200, .3, .04); },
  bomb(){ noise(1, .3, 500); snd('sine', 90, 25, 1, .3); },
  banner(){ snd('sawtooth', 100, 400, .6, .05); }
};

/* ---------- glow sprites ---------- */
const glowCache = {};
function glow(col){
  if (glowCache[col]) return glowCache[col];
  const orig = col;
  if (col.length === 4) col = '#' + col[1] + col[1] + col[2] + col[2] + col[3] + col[3];
  const c =document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, col); gr.addColorStop(.35, col + 'aa'); gr.addColorStop(1, col + '00');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return glowCache[orig] = c;
}
function drawGlow(col, x, y, w, h = w, a = 1){
  ctx.globalAlpha = a; ctx.drawImage(glow(col), x - w / 2, y - h / 2, w, h);
}
const cloudImgs = [];
for (let v = 0; v < 3; v++){
  const c = document.createElement('canvas'); c.width = 300; c.height = 150;
  const g = c.getContext('2d');
  for (let i = 0; i < 9; i++){
    const x = 50 + Math.random() * 200, y = 45 + Math.random() * 60, r = 30 + Math.random() * 40;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  cloudImgs.push(c);
}

/* ---------- input ---------- */
const keys = {};
const ptr = { x: W / 2, y: H * .75, active: false, touch: false, lastTap: 0 };
let touches = 0;
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true; initAudio();
  if (e.code === 'Escape') { if (scene !== 'menu') goMenu(); return; }
  if (e.code === 'KeyM') muted = !muted;
  if (scene === 'menu') {
    const n = { Digit1: 0, Numpad1: 0, Digit2: 1, Numpad2: 1, Digit3: 2, Numpad3: 2 }[e.code];
    if (n !== undefined) enterGame(GAMES[n].id);
    return;
  }
  if (scene !== 'striker') { if (e.code === 'KeyP') paused = !paused; games[scene].onKey(e); return; }
  if (e.code === 'Enter' && state !== 'play') startGame();
  if (state === 'title' && e.code === 'Space') startGame();
  else if (state === 'play') {
    if (e.code === 'Space' || e.code === 'KeyE') fireMissile();
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') doRoll();
    if (e.code === 'KeyB') doBomb();
    if (e.code === 'KeyP') paused = !paused;
  }
});
addEventListener('keyup', e => keys[e.code] = false);
function toLogical(e){
  const r = cv.getBoundingClientRect();
  ptr.x = (e.clientX - r.left) / r.width * W; ptr.y = (e.clientY - r.top) / r.height * H;
}
cv.addEventListener('pointerdown', e => {
  initAudio(); toLogical(e); ptr.touch = e.pointerType !== 'mouse'; touches++;
  if (scene === 'menu') { const n = cardIndexAt(); if (n >= 0) enterGame(GAMES[n].id); return; }
  if (scene !== 'striker') { ptr.active = true; games[scene].onPointer(e); return; }
  if (state !== 'play') { if (state === 'title' || deadT > 1.6) startGame(); return; }
  ptr.active = true;
  if (ptr.touch) {
    const n = performance.now();
    if (touches >= 2) doBomb();
    else if (n - ptr.lastTap < 300) doRoll();
    ptr.lastTap = n;
  } else {
    if (e.button === 0) fireMissile();
    if (e.button === 2) doRoll();
  }
});
cv.addEventListener('pointermove', e => { toLogical(e); if (!ptr.touch || touches > 0) ptr.active = true; });
addEventListener('pointerup', e => { touches = Math.max(0, touches - 1); if (e.pointerType !== 'mouse' && touches === 0) ptr.active = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- state ---------- */
let state = 'title', paused = false, t = 0, ts = 1, shake = 0, flash = 0, flashCol = '#fff', deadT = 0;
let P, bullets, ebullets, enemies, parts, rings, texts, pups;
let score = 0, dispScore = 0, best = 0, wave = 1, combo = 0, comboT = 0, comboPop = 0, kills = 0;
let spawnQ = [], wt = 0, clearing = false, clearT = 0, banner = null, scroll = 1, bgFlash = 0, bgFlashT = 3;
try { best = +localStorage.getItem('skystriker_best') || 0; } catch (e) {}

/* ---------- background ---------- */
const stars = Array.from({ length: 90 }, () => ({ x: rand(0, W), y: rand(0, H), s: rand(.5, 1.8), sp: rand(15, 50) }));
const clouds = Array.from({ length: 16 }, (_, i) => ({
  x: rand(-100, W), y: rand(-100, H), layer: i % 3, img: cloudImgs[i % 3]
}));
const streaks = Array.from({ length: 30 }, () => ({ x: rand(0, W), y: rand(0, H), l: rand(40, 140), sp: rand(700, 1400) }));
let vig = null;
function makeVig(){ vig = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .75); vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,10,.65)'); }
makeVig();

function updateBg(dt){
  const target = (state === 'play' && P && P.roll > 0) ? 3.2 : 1;
  scroll += (target - scroll) * Math.min(1, dt * 5);
  stars.forEach(s => { s.y += s.sp * dt * scroll; if (s.y > H) { s.y = -4; s.x = rand(0, W); } });
  clouds.forEach(c => {
    const sp = [70, 130, 230][c.layer] * scroll;
    c.y += sp * dt; if (c.y > H + 120) { c.y = -160; c.x = rand(-120, W); }
  });
  streaks.forEach(s => { s.y += s.sp * dt * scroll; if (s.y > H + 150) { s.y = -150; s.x = rand(0, W); } });
  bgFlashT -= dt; if (bgFlashT < 0 && wave >= 3) { bgFlash = .35; bgFlashT = rand(4, 10); }
  bgFlash = Math.max(0, bgFlash - dt * 1.2);
}
function drawBg(){
  const hue = (205 + (wave - 1) * 22) % 360;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${hue},65%,10%)`); g.addColorStop(.55, `hsl(${(hue + 15) % 360},60%,26%)`); g.addColorStop(1, `hsl(${(hue + 35) % 360},70%,50%)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(`#ffb36b`, W * .7 + Math.sin(t * .1) * 40, H * .85, 700, 400, .35);
  ctx.globalAlpha = 1;
  stars.forEach(s => { ctx.globalAlpha = .4 + .5 * Math.abs(Math.sin(t * 2 + s.x)); ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.s, s.s * (1 + scroll * .8)); });
  ctx.globalCompositeOperation = 'source-over';
  clouds.forEach(c => {
    if (c.layer === 2) return;
    const sc = [1.2, 1.8][c.layer];
    ctx.globalAlpha = [.35, .5][c.layer]; ctx.drawImage(c.img, c.x, c.y, 300 * sc, 150 * sc);
  });
  ctx.globalAlpha = 1;
}
function drawBgFront(){
  ctx.globalCompositeOperation = 'source-over';
  clouds.forEach(c => { if (c.layer !== 2) return; ctx.globalAlpha = .45; ctx.drawImage(c.img, c.x, c.y, 300 * 2.6, 150 * 2.6); });
  ctx.globalCompositeOperation = 'lighter';
  const a = clamp((scroll - 1) / 2.2, 0, 1) * .6 + .06;
  ctx.strokeStyle = '#cfe8ff'; ctx.lineWidth = 1.5;
  streaks.forEach(s => { ctx.globalAlpha = a; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y - s.l * scroll); ctx.stroke(); });
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (bgFlash > 0) { ctx.fillStyle = `rgba(220,230,255,${bgFlash * .35})`; ctx.fillRect(0, 0, W, H); }
}

/* ---------- shapes ---------- */
function sym(p){
  ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
  for (let i = p.length - 1; i >= 0; i--) ctx.lineTo(-p[i][0], p[i][1]);
  ctx.closePath();
}
const SH = {
  jet: [[0, -36], [6, -14], [34, 12], [34, 22], [9, 14], [9, 30], [0, 26]],
  scout: [[0, 24], [8, 4], [26, -10], [26, -18], [8, -12], [0, -16]],
  fighter: [[0, 28], [10, 8], [32, 10], [32, -6], [14, -14], [8, -26], [0, -20]],
  bomber: [[0, 44], [16, 26], [46, 12], [46, -14], [22, -30], [12, -42], [0, -36]],
  boss: [[0, 66], [30, 44], [84, 22], [96, -10], [62, -42], [30, -54], [0, -44]]
};
function drawJet(x, y, s, bank, rollAng, alpha = 1, flame = 1){
  ctx.save(); ctx.translate(x, y); ctx.rotate(bank * .15); ctx.scale(s, s);
  ctx.globalAlpha = alpha;
  const sx = rollAng ? Math.cos(rollAng) : Math.cos(bank * .55);
  ctx.scale(sx, 1);
  // engine flame
  const fl = (22 + Math.random() * 14) * flame;
  ctx.globalCompositeOperation = 'lighter';
  drawGlow('#ff7a1a', 0, 34 + fl * .3, 40, fl * 2.2, alpha); drawGlow('#bfe9ff', 0, 30, 18, fl, alpha);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = alpha;
  const g = ctx.createLinearGradient(-34, 0, 34, 0);
  g.addColorStop(0, '#5b7aa8'); g.addColorStop(.5, '#e6f1ff'); g.addColorStop(1, '#5b7aa8');
  ctx.fillStyle = Math.cos(rollAng || 0) < 0 ? '#41566f' : g;
  sym(SH.jet); ctx.fill(); ctx.strokeStyle = '#0a1a33'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#ff4d5e'; ctx.fillRect(-34 * 0.9, 14, 6, 3); ctx.fillRect(34 * 0.9 - 6, 14, 6, 3);
  ctx.fillStyle = '#35c8ff'; ctx.beginPath(); ctx.ellipse(0, -8, 4, 11, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(-1, -11, 1.5, 4, 0, 0, TAU); ctx.fill();
  ctx.restore(); ctx.globalAlpha = 1;
}

/* ---------- spawn helpers ---------- */
function newPlayer(){
  return { x: W / 2, y: H + 80, vx: 0, vy: 0, hp: 5, maxhp: 5, shield: 0, wl: 1, missiles: 3, bombs: 2, cd: 0, mcd: 0,
    roll: 0, rollAng: 0, rollCd: 0, rollDir: 1, inv: 0, dead: false, intro: 1.2 };
}
function startGame(){
  state = 'play'; paused = false; P = newPlayer();
  bullets = []; ebullets = []; enemies = []; parts = []; rings = []; texts = []; pups = [];
  score = 0; dispScore = 0; wave = 1; combo = 0; comboT = 0; kills = 0; deadT = 0; ts = 1; shake = 0;
  clearing = false; flash = .6; flashCol = '#fff';
  startWave(1);
}
function setBanner(txt, sub, col, dur = 2.6){ banner = { txt, sub, col, t: dur, dur }; sfx.banner(); }
function startWave(n){
  wave = n; spawnQ = []; wt = 0; clearing = false;
  const boss = n % 5 === 0;
  if (boss) {
    spawnQ.push({ t: 3.2, type: 'boss', x: W / 2 });
    setBanner('WARNING', 'BOSS APPROACHING', '#ff3b55');
  } else {
    const pool = ['scout', 'scout'];
    if (n >= 2) pool.push('fighter', 'fighter');
    if (n >= 3) pool.push('kamikaze');
    if (n >= 4) pool.push('bomber');
    let tt = 2.4; const cnt = 4 + n * 2;
    for (let i = 0; i < cnt; i++){
      const type = pool[Math.floor(Math.random() * pool.length)];
      const x = rand(70, W - 70);
      if (type === 'scout') { for (let k = 0; k < 4; k++) spawnQ.push({ t: tt + k * .3, type, x }); tt += 1.8; }
      else { spawnQ.push({ t: tt, type, x }); tt += type === 'bomber' ? 2.6 : .9 + rand(0, .6); }
    }
    setBanner('WAVE ' + n, 'GET READY', '#5ad1ff');
  }
}
const ETYPES = {
  scout: { hp: 3, r: 20, score: 100, col: '#ff5d8f' },
  fighter: { hp: 7, r: 24, score: 250, col: '#a974ff' },
  kamikaze: { hp: 3, r: 18, score: 200, col: '#ffa23a' },
  bomber: { hp: 28, r: 40, score: 700, col: '#7d8aa0' },
  boss: { hp: 0, r: 64, score: 8000, col: '#ff3b55' }
};
function spawnEnemy(type, x){
  const d = ETYPES[type];
  const hp = type === 'boss' ? 220 + wave * 32 : d.hp + Math.floor(wave / 6);
  enemies.push({ type, x, x0: x, y: -60, vx: 0, vy: 0, hp, maxhp: hp, r: d.r, t: 0, flash: 0, sh: rand(.5, 1.5),
    ph: rand(0, TAU), ang: 0, pt: 0, sp: 0, sum: 6, inn: false, ang2: Math.PI / 2 });
}
function eb(x, y, ang, spd, col = '#ff4d8d', r = 6){
  ebullets.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r, col });
}
function aim(e){ return Math.atan2(P.y - e.y, P.x - e.x); }

/* ---------- effects ---------- */
function addP(p){ if (parts.length < 1100) parts.push(p); }
function boom(x, y, s = 1, col = '#ffb347'){
  rings.push({ x, y, r: 4, mr: 70 * s, life: .55, max: .55, w: 5 * s, col: '#ffd27a' });
  rings.push({ x, y, r: 2, mr: 110 * s, life: .35, max: .35, w: 2, col: '#ffffff' });
  for (let i = 0; i < 22 * s; i++){
    const a = rand(0, TAU), sp = rand(80, 480) * Math.sqrt(s);
    addP({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.3, .8), max: .8, col, drag: 2.2 });
  }
  for (let i = 0; i < 9 * s; i++){
    const a = rand(0, TAU), sp = rand(10, 120) * s;
    addP({ type: 'fire', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.35, .7), max: .7, size: rand(40, 90) * s, drag: 2 });
  }
  for (let i = 0; i < 6 * s; i++){
    const a = rand(0, TAU), sp = rand(20, 140);
    addP({ type: 'smoke', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20, life: rand(.8, 1.5), max: 1.5, size: rand(14, 30) * s, drag: 1.5 });
  }
  for (let i = 0; i < 6 * s; i++){
    const a = rand(0, TAU), sp = rand(100, 300);
    addP({ type: 'deb', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.6, 1.2), max: 1.2, size: rand(3, 7), rot: rand(0, TAU), vr: rand(-10, 10), col: '#3a3f55', drag: 1 });
  }
  shake = Math.max(shake, 7 * Math.min(s, 3)); sfx.boom(s);
}
function spark(x, y, n, col = '#fff', sp0 = 200){
  for (let i = 0; i < n; i++){
    const a = rand(0, TAU), sp = rand(40, sp0);
    addP({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.15, .4), max: .4, col, drag: 3 });
  }
}
function floatText(x, y, txt, col = '#fff', size = 20){ texts.push({ x, y, txt, col, size, life: 1, max: 1 }); }

/* ---------- player actions ---------- */
function shootPrimary(){
  const w = P.wl, y = P.y - 28;
  const mk = (dx, ang, col = '#8be9ff', dmg = 1) => bullets.push({ x: P.x + dx, y, vx: Math.sin(ang) * 900, vy: -Math.cos(ang) * 900, dmg, r: 5, col });
  if (w === 1) { mk(-9, 0); mk(9, 0); }
  else if (w === 2) { mk(-12, 0); mk(0, 0, '#bff6ff'); mk(12, 0); }
  else if (w === 3) { mk(-14, -.07); mk(-5, 0); mk(5, 0); mk(14, .07); mk(0, 0, '#ffffff'); }
  else { mk(-16, -.14, '#ffd36b'); mk(-8, -.05); mk(0, 0, '#fff'); mk(8, .05); mk(16, .14, '#ffd36b'); mk(-24, -.28, '#ff9a5a'); mk(24, .28, '#ff9a5a'); }
  addP({ type: 'fire', x: P.x - 9, y: P.y - 30, vx: 0, vy: -30, life: .08, max: .08, size: 26, drag: 1 });
  addP({ type: 'fire', x: P.x + 9, y: P.y - 30, vx: 0, vy: -30, life: .08, max: .08, size: 26, drag: 1 });
  sfx.shoot();
}
function fireMissile(){
  if (!P || P.dead || P.missiles <= 0 || P.mcd > 0) return;
  P.missiles--; P.mcd = .3;
  for (const s of [-1, 1]) bullets.push({ x: P.x + s * 22, y: P.y, vx: 0, vy: -300, dmg: 14, r: 7, homing: true, ang: -Math.PI / 2 + s * .7, spd: 280, life: 3, col: '#ffa24a' });
  sfx.missile(); shake = Math.max(shake, 3);
}
function doRoll(){
  if (!P || P.dead || P.rollCd > 0 || P.intro > 0) return;
  let ix = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  if (!ix && ptr.active) ix = Math.sign(ptr.x - P.x);
  P.rollDir = ix || (P.vx >= 0 ? 1 : -1);
  P.roll = .5; P.rollCd = 1.7; P.inv = Math.max(P.inv, .7); P.vx = P.rollDir * 800; P.rollAng = 0;
  rings.push({ x: P.x, y: P.y, r: 10, mr: 80, life: .4, max: .4, w: 3, col: '#9ff' });
  sfx.roll();
}
function doBomb(){
  if (!P || P.dead || P.bombs <= 0) return;
  P.bombs--; sfx.bomb(); flash = 1; flashCol = '#fff'; shake = 22; ts = .35;
  rings.push({ x: P.x, y: P.y, r: 10, mr: 900, life: .9, max: .9, w: 24, col: '#7fe0ff' });
  rings.push({ x: P.x, y: P.y, r: 10, mr: 700, life: .7, max: .7, w: 10, col: '#ffffff' });
  rings.push({ x: P.x, y: P.y, r: 10, mr: 500, life: .55, max: .55, w: 6, col: '#ffd27a' });
  ebullets.forEach(b => { spark(b.x, b.y, 4, '#ff9ac0', 160); score += 5; });
  ebullets = [];
  enemies.forEach(e => { e.hp -= e.type === 'boss' ? 60 : 40; e.flash = .2; });
  setBanner('BOMB!', '', '#7fe0ff', .8);
}
function hurtPlayer(d = 1){
  if (P.inv > 0 || P.dead) return;
  if (P.shield > 0) {

    const d = { tank: [56, 26, 1, 150], aa: [44, 34, 1, 250], building: [64, rand(70, 130), 2, 200], fuel: [46, 44, 1, 300], radar: [30, 80, 1, 350] }[type];
    return { type, x, w: d[0], h: d[1], hp: d[2], maxhp: d[2], sc: d[3], t: rand(0, 5), cd: rand(1, 2.5), dead: false, wreck: false };
  },
  onKey(e){ if (this.over && this.overT > 1 && (e.code === 'Enter' || e.code === 'Space')) this.init(); },
  onPointer(){ if (this.over) { if (this.overT > 1) this.init(); return; } this.tap = true; },
  drop(){
    this.bombs.push({ x: this.cam + this.px, y: this.py + 14, vx: this.v + this.vx, vy: 60 });
    this.cd = .32; snd('sine', 520, 180, .25, .05);
  },
  blast(x, r){
    const sx = x - this.cam;
    rings.push({ x: sx, y: BG_G - 6, r: 6, mr: r * 1.1, life: .4, max: .4, w: 5, col: '#ffd27a' });
    rings.push({ x: sx, y: BG_G - 6, r: 4, mr: r * 1.6, life: .3, max: .3, w: 2, col: '#ffffff' });
    boom(sx, BG_G - 14, r / 80);
    for (const t of this.targets){
      if (t.dead) continue;
      if (Math.abs(t.x - x) < r + t.w / 2){ t.hp--; if (t.hp <= 0) this.destroy(t); else { spark(t.x - this.cam, BG_G - t.h / 2, 12, '#ffcf7a', 300); } }
    }
  },
  destroy(t){
    t.dead = true; t.wreck = true; this.killed++; this.combo++; this.comboT = 2.2;
    const pts = Math.round(t.sc * (1 + Math.floor(this.combo / 3) * .5)); this.score += pts;
    floatText(t.x - this.cam, BG_G - t.h - 10, '+' + pts, '#ffe08a', 22);
    if (t.type === 'fuel'){
      this.delayed.push({ t: .12, fn: () => this.blast(t.x, 150) });
      floatText(t.x - this.cam, BG_G - t.h - 40, 'CHAIN!', '#ff9a5a', 24); shake = Math.max(shake, 14);
    } else if (t.type === 'building') boom(t.x - this.cam, BG_G - t.h / 2, 1.5);
  },
  fire(t){
    const gx = t.x, gy = BG_G - (t.type === 'aa' ? 28 : 24);
    const tx = this.cam + this.px + (this.v + this.vx) * .55, ty = this.py + this.vy * .55;
    const a = Math.min(Math.atan2(ty - gy, tx - gx), -.25), sp = t.type === 'aa' ? 330 : 260;
    this.shots.push({ x: gx, y: gy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp });
    spark(gx - this.cam, gy, 6, '#ffd36b', 160); snd('square', 300, 120, .08, .02);
  },
  hurt(){
    if (this.inv > 0 || this.over) return;
    this.hp--; this.inv = 1.3; shake = 14; flash = .5; flashCol = '#ff2a3a'; this.combo = 0; sfx.hurt();
    spark(this.px, this.py, 22, '#ffb070', 350);
    if (this.hp <= 0){ this.over = true; this.overT = 0; boom(this.px, this.py, 3); ts = .3; saveBest('bomber', this.score); }
  },
  update(dt){
    this.v = 210 + this.stage * 10;
    for (let i = this.delayed.length - 1; i >= 0; i--){ const d = this.delayed[i]; d.t -= dt; if (d.t <= 0){ this.delayed.splice(i, 1); d.fn(); } }
    if (this.over){
      this.overT += dt;
      for (const tt of this.targets) tt.t += dt;
      return;
    }
    this.cam += this.v * dt;
    // input
    const sp = 300;
    const kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    const ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    let dvx = 0, dvy = 0;
    if (kx || ky){ const l = Math.hypot(kx, ky); dvx = kx / l * sp; dvy = ky / l * sp; }
    else if (ptr.active){ dvx = clamp((ptr.x - this.px) * 7, -sp * 1.5, sp * 1.5); dvy = clamp((ptr.y - this.py) * 7, -sp * 1.5, sp * 1.5); }
    this.vx += (dvx - this.vx) * Math.min(1, dt * 8); this.vy += (dvy - this.vy) * Math.min(1, dt * 8);
    this.px = clamp(this.px + this.vx * dt, 70, W - 120); this.py = clamp(this.py + this.vy * dt, 90, 430);
    this.cd -= dt; this.inv -= dt;
    const want = keys.Space || this.tap || (!ptr.touch && touches > 0) || (ptr.touch && touches >= 2); this.tap = false;
    if (want && this.cd <= 0) this.drop();
    addP({ type: 'smoke', x: this.px - 34, y: this.py + rand(-2, 2), vx: -120, vy: rand(-8, 8), life: .5, max: .5, size: 7, drag: 1 });
    addP({ type: 'fire', x: this.px - 32, y: this.py, vx: -160, vy: 0, life: .15, max: .15, size: 22, drag: 1 });
    if (this.hp <= 2 && Math.random() < .4) addP({ type: 'smoke', x: this.px, y: this.py, vx: -150, vy: rand(-30, 0), life: .8, max: .8, size: 12, drag: 1 });
    // bombs
    for (const b of this.bombs){
      b.vy += 900 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      if (Math.random() < .6) addP({ type: 'smoke', x: b.x - this.cam, y: b.y, vx: -this.v * .5, vy: -10, life: .4, max: .4, size: 5, drag: 1 });
      let hit = b.y >= BG_G - 6;
      if (!hit) for (const t of this.targets) if (!t.dead && Math.abs(t.x - b.x) < t.w / 2 + 4 && b.y > BG_G - t.h) { hit = true; break; }
      if (hit){ b.dead = true; this.blast(b.x, 85); }
    }
    this.bombs = this.bombs.filter(b => !b.dead);
    // targets
    for (const t of this.targets){
      t.t += dt; if (t.dead) continue;
      if (t.type === 'tank') t.x -= 28 * dt;
      const sx = t.x - this.cam;
      if ((t.type === 'aa' || t.type === 'tank') && sx > 20 && sx < W - 10){
        t.cd -= dt;
        if (t.cd <= 0){ t.cd = (t.type === 'aa' ? rand(1.5, 2.4) : rand(2.8, 4)) / (1 + this.stage * .06); this.fire(t); }
      }
      if (sx < -120){ t.dead = true; this.escaped++; }
    }
    this.targets = this.targets.filter(t => t.x - this.cam > -300);
    // shots
    for (const s of this.shots){
      s.x += s.vx * dt; s.y += s.vy * dt;
      const sx = s.x - this.cam;
      if (sx < -60 || sx > W + 60 || s.y < -40) s.dead = true;
      else if ((sx - this.px) ** 2 + (s.y - this.py) ** 2 < 22 * 22){ s.dead = true; this.hurt(); }
    }
    this.shots = this.shots.filter(s => !s.dead);
    if (this.comboT > 0){ this.comboT -= dt; if (this.comboT <= 0) this.combo = 0; }
    // stage end
    if (this.phase === 'play' && this.cam >= this.len){
      const ratio = this.killed / this.total;
      if (ratio >= .6){
        this.phase = 'clear'; this.clearT = 3; const bonus = 1000 * this.stage; this.score += bonus;
        setBanner('STAGE CLEAR', '+' + bonus + '  (' + Math.round(ratio * 100) + '% 파괴)', '#8dff8d', 2.6);
      } else {
        this.over = true; this.overT = 0; this.failMsg = 'MISSION FAILED'; saveBest('bomber', this.score);
      }
    }
    if (this.phase === 'clear'){ this.clearT -= dt; if (this.clearT <= 0){ this.stage++; this.hp = Math.min(5, this.hp + 1); this.begin(); } }
  },
  mount(f, base, amp, col){
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, BG_G);
    for (let x = 0; x <= W; x += 12){
      const u = x + this.cam * f;
      ctx.lineTo(x, base - amp * (.55 + .3 * Math.sin(u * .007) + .15 * Math.sin(u * .019 + 2) + .1 * Math.sin(u * .043)));
    }
    ctx.lineTo(W, BG_G); ctx.closePath(); ctx.fill();
  },
  drawTarget(t){
    const sx = t.x - this.cam; if (sx < -100 || sx > W + 100) return;
    ctx.save(); ctx.translate(sx, BG_G);
    if (t.dead){
      ctx.fillStyle = '#1c1c22'; ctx.fillRect(-t.w / 2, -8, t.w, 8); ctx.fillStyle = '#2b2b33'; ctx.fillRect(-t.w / 3, -14, t.w / 2, 6);
      ctx.restore();
      if (t.wreck && Math.random() < .3) {
        addP({ type: 'fire', x: sx + rand(-t.w / 3, t.w / 3), y: BG_G - 10, vx: -this.v - 5, vy: rand(-90, -40), life: .5, max: .5, size: rand(18, 30), drag: 1 });
        if (Math.random() < .5) addP({ type: 'smoke', x: sx, y: BG_G - 14, vx: -this.v, vy: rand(-80, -40), life: 1, max: 1, size: 10, drag: 1 });
      }
      return;
    }
    const ang = Math.min(Math.atan2(this.py - (BG_G - 24), this.px - sx), -.12);
    if (t.type === 'tank'){
      ctx.fillStyle = '#222'; ctx.beginPath(); ctx.roundRect(-30, -10, 60, 10, 5); ctx.fill();
      ctx.fillStyle = '#4a6a3c'; ctx.beginPath(); ctx.roundRect(-26, -22, 52, 14, 4); ctx.fill();
      ctx.save(); ctx.translate(0, -24); ctx.rotate(ang); ctx.fillStyle = '#3a542f'; ctx.fillRect(0, -3, 28, 6); ctx.restore();
      ctx.fillStyle = '#5b7e4a'; ctx.beginPath(); ctx.ellipse(0, -24, 13, 8, 0, 0, TAU); ctx.fill();
    } else if (t.type === 'aa'){
      ctx.fillStyle = '#4b5361'; ctx.beginPath(); ctx.moveTo(-22, 0); ctx.lineTo(22, 0); ctx.lineTo(14, -16); ctx.lineTo(-14, -16); ctx.closePath(); ctx.fill();
      ctx.save(); ctx.translate(0, -22); ctx.rotate(ang); ctx.fillStyle = '#9aa5b8'; ctx.fillRect(0, -5, 36, 3.5); ctx.fillRect(0, 1.5, 36, 3.5); ctx.restore();
      ctx.fillStyle = '#c33'; ctx.beginPath(); ctx.arc(0, -22, 8, 0, TAU); ctx.fill();
      if (t.cd < .35){ ctx.globalCompositeOperation = 'lighter'; drawGlow('#ffd36b', Math.cos(ang) * 36, -22 + Math.sin(ang) * 36, 40, 40, 1); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; }
    } else if (t.type === 'building'){
      const g = ctx.createLinearGradient(-t.w / 2, 0, t.w / 2, 0); g.addColorStop(0, '#59627a'); g.addColorStop(1, '#8590a8');
      ctx.fillStyle = g; ctx.fillRect(-t.w / 2, -t.h, t.w, t.h);
      for (let yy = -t.h + 10; yy < -10; yy += 16) for (let xx = -t.w / 2 + 8; xx < t.w / 2 - 8; xx += 16){
        ctx.fillStyle = ((Math.floor(xx) * 7 + Math.floor(yy) * 13) & 3) ? '#ffe08a' : '#2a3042'; ctx.fillRect(xx, yy, 8, 9);
      }
      if (t.hp < t.maxhp){ ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-10, -t.h); ctx.lineTo(0, -t.h / 2); ctx.lineTo(-8, 0); ctx.stroke();
        if (Math.random() < .3) addP({ type: 'smoke', x: sx, y: BG_G - t.h, vx: -this.v, vy: -50, life: .9, max: .9, size: 10, drag: 1 }); }
    } else if (t.type === 'fuel'){
      ctx.fillStyle = '#d9dbe3'; ctx.fillRect(-23, -44, 46, 44); ctx.fillStyle = '#d33'; ctx.fillRect(-23, -30, 46, 10);
      ctx.fillStyle = '#eceef5'; ctx.beginPath(); ctx.ellipse(0, -44, 23, 6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#222'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('☢', 0, -8);
    } else if (t.type === 'radar'){
      ctx.fillStyle = '#8a93a6'; ctx.fillRect(-4, -62, 8, 62); ctx.fillRect(-14, -6, 28, 6);
      ctx.save(); ctx.translate(0, -64); ctx.rotate(Math.sin(t.t * 2) * .5); ctx.fillStyle = '#d6dcea'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 7, 0, 0, TAU); ctx.fill(); ctx.restore();
      ctx.fillStyle = Math.floor(t.t * 3) % 2 ? '#f44' : '#611'; ctx.beginPath(); ctx.arc(0, -72, 3, 0, TAU); ctx.fill();
    }
    ctx.restore();
  },
  draw(){
    const h = (205 + (this.stage - 1) * 30) % 360;
    const g = ctx.createLinearGradient(0, 0, 0, BG_G);
    g.addColorStop(0, `hsl(${h},60%,20%)`); g.addColorStop(1, `hsl(${(h + 20) % 360},75%,62%)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter'; drawGlow('#ffd9a0', W * .72, BG_G - 170, 520, 520, .55); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    for (const c of this.cl){
      const span = W + 500, sx = ((c.x - this.cam * .2 * c.s) % span + span) % span - 250;
      ctx.globalAlpha = .45; ctx.drawImage(c.img, sx, c.y, 300 * c.s, 150 * c.s);
    }
    ctx.globalAlpha = 1;
    this.mount(.08, BG_G - 60, 200, `hsl(${h},30%,32%)`);
    this.mount(.2, BG_G - 20, 130, `hsl(${h},28%,24%)`);
    this.mount(.4, BG_G + 5, 70, `hsl(${h},26%,17%)`);
    const gg = ctx.createLinearGradient(0, BG_G, 0, H); gg.addColorStop(0, '#46582f'); gg.addColorStop(1, '#16200f');
    ctx.fillStyle = gg; ctx.fillRect(0, BG_G, W, H - BG_G);
    ctx.fillStyle = '#6a8644'; ctx.fillRect(0, BG_G, W, 5);
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 3;
    for (let x = -(this.cam % 90); x < W + 90; x += 90){ ctx.beginPath(); ctx.moveTo(x, BG_G + 8); ctx.lineTo(x - 40, H); ctx.stroke(); }
    // wind streaks
    ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 12; i++){ const x = W - (((t * 500 + i * 173) % (W + 200)) - 100), y = (i * 83) % (BG_G - 100) + 30; ctx.globalAlpha = .12; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 80, y); ctx.stroke(); }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    for (const tt of this.targets) this.drawTarget(tt);
    if (!this.over){
      // landing marker
      const hh = BG_G - 8 - (this.py + 14), tf = (-60 + Math.sqrt(3600 + 2 * 900 * Math.max(0, hh))) / 900;
      const lx = this.px + (this.v + this.vx) * tf;
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = '#ffb04a'; ctx.globalAlpha = .55; ctx.lineWidth = 2; ctx.setLineDash([6, 8]); ctx.lineDashOffset = -t * 40;
      ctx.beginPath(); ctx.moveTo(this.px, this.py + 16); ctx.lineTo(lx, BG_G - 6); ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha = .9; ctx.save(); ctx.translate(lx, BG_G - 4); ctx.scale(1, .3); ctx.beginPath(); ctx.arc(0, 0, 30 + Math.sin(t * 8) * 3, 0, TAU); ctx.stroke(); ctx.restore(); ctx.restore();
    }
    // shots
    ctx.globalCompositeOperation = 'lighter';
    for (const s of this.shots){ drawGlow('#ff5a5a', s.x - this.cam, s.y, 30, 30, .9); drawGlow('#ffffff', s.x - this.cam, s.y, 10, 10, 1); }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    // bombs
    for (const b of this.bombs){
      ctx.save(); ctx.translate(b.x - this.cam, b.y); ctx.rotate(Math.atan2(b.vy, b.vx - this.v));
      ctx.fillStyle = '#20242c'; ctx.beginPath(); ctx.ellipse(0, 0, 11, 5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#c33'; ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(-15, -6); ctx.lineTo(-15, 6); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // plane
    if (!this.over){
      const a = this.inv > 0 && Math.floor(t * 20) % 2 ? .4 : 1;
      ctx.save(); ctx.translate(this.px, this.py); ctx.rotate(Math.PI / 2 + clamp(this.vy / 700, -.4, .4)); drawJet(0, 0, .85, 0, 0, a, 1.1); ctx.restore();
    }
  },
  hud(){
    txt(String(Math.round(this.score)).padStart(7, '0'), 18, 28, 30, '#fff', 'left');
    txt('BEST ' + String(Math.max(bestOf('bomber'), this.score)).padStart(7, '0'), 20, 54, 13, '#9fb6d8', 'left', '600');
    txt('STAGE ' + this.stage, W - 18, 28, 22, '#ffb04a', 'right');
    hpBar(this.hp, 5, W - 18, 44);
    const need = Math.ceil(this.total * .6), ok = this.killed >= need;
    txt('파괴 ' + this.killed + ' / ' + this.total + '  (필요 ' + need + ')', 18, 80, 15, ok ? '#8dff8d' : '#ffd36b', 'left', '800');
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(18, 98, W - 36, 5);
    ctx.fillStyle = '#ffb04a'; ctx.fillRect(18, 98, (W - 36) * clamp(this.cam / this.len, 0, 1), 5);
    ctx.fillStyle = '#fff'; ctx.fillRect(18 + (W - 36) * clamp(this.cam / this.len, 0, 1) - 2, 94, 4, 13);
    if (this.combo >= 2){ txt(this.combo + ' COMBO', 18, 128, 24, `hsl(${(40 - this.combo * 4 + 360) % 360},100%,62%)`, 'left', '900'); }
    txt('이동 WASD/마우스 · 폭탄 SPACE / 클릭 (표시된 낙하점 + 이동 보정)', W / 2, H - 20, 12, 'rgba(255,255,255,.7)', 'center', '600');
    if (this.over) overlay(this.failMsg, '#ff6b7f', ['SCORE  ' + Math.round(this.score), 'STAGE ' + this.stage + '  ·  파괴 ' + this.killed + '/' + this.total], clamp((this.overT - 1) * 2, 0, 1));
  }
};

/* ======================= GAME 3: RING RUN ======================= */
const RPZ = 260, RRX = 330, RRY = 230;
games.ring = {
  init(){
    resetFx();
    Object.assign(this, { px: 0, py: 0, vx: 0, vy: 0, camx: 0, camy: 0, hp: 3, time: 40, score: 0, rings: 0, miss: 0, combo: 0, speed: 600, run: 0, energy: 1,
      boost: false, spawnZ: 1800, lx: 0, ly: 0, lz: 400, inv: 0, over: false, overT: 0, why: 'GAME OVER', F: 430, ringIdx: 0 });
    this.objs = []; this.stars = []; this.cl = [];
    for (let i = 0; i < 160; i++) this.stars.push({ x: rand(-1800, 1800), y: rand(-1400, 1400), z: rand(100, 4000) });
    for (let i = 0; i < 14; i++) this.cl.push(this.mkCloud(rand(1000, 6000)));
    setBanner('RING RUN', '링을 통과하라!  SHIFT = 부스트', '#7dffa8');
  },
  mkCloud(z){
    let x = rand(-1500, 1500), y = rand(-1100, 1100);
    if (Math.abs(x) < 500 && Math.abs(y) < 400) { x += Math.sign(x || 1) * 600; }
    return { x, y, z, img: cloudImgs[Math.floor(Math.random() * 3)] };
  },
  onKey(e){ if (this.over && this.overT > 1 && (e.code === 'Enter' || e.code === 'Space')) this.init(); },
  onPointer(){ if (this.over && this.overT > 1) this.init(); },
  proj(x, y, z){ const s = this.F / z; return { x: W / 2 + (x - this.camx) * s, y: H * .5 + (y - this.camy) * s, s }; },
  spawnRing(z){
    const diff = Math.min(1, this.run / 80);
    const nx = clamp(this.lx + rand(-320, 320) * (.6 + .5 * diff), -RRX * .9, RRX * .9);
    const ny = clamp(this.ly + rand(-240, 240) * (.6 + .5 * diff), -RRY * .9, RRY * .9);
    for (let j = 1; j <= 3; j++){
      const f = j / 4;
      this.objs.push({ k: 'orb', x: this.lx + (nx - this.lx) * f, y: this.ly + (ny - this.ly) * f, z: this.lz + (z - this.lz) * f, r: 28, done: 0 });
    }
    if (Math.random() < .3 + .5 * diff){
      const f = .5;
      this.objs.push({ k: 'mine', x: this.lx + (nx - this.lx) * f + rand(-50, 50), y: this.ly + (ny - this.ly) * f + rand(-40, 40), z: this.lz + (z - this.lz) * f, r: 55, rot: rand(0, TAU), done: 0 });
    }
    if (Math.random() < .4 + .4 * diff){
      this.objs.push({ k: 'mine', x: rand(-RRX, RRX), y: rand(-RRY, RRY), z: this.lz + (z - this.lz) * rand(.2, .8), r: 55, rot: rand(0, TAU), done: 0 });
    }
    this.objs.push({ k: 'ring', x: nx, y: ny, z, r: 130 - diff * 30, done: 0, state: 0, pt: 0, c: this.ringIdx++ % 3 });
    this.lx = nx; this.ly = ny; this.lz = z;
  },
  crash(why){
    this.over = true; this.overT = 0; this.why = why; saveBest('ring', this.score);
    if (why === 'CRASHED') { const p = this.proj(this.px, this.py, RPZ); boom(p.x, p.y, 3); ts = .3; }
  },
  update(dt){
    for (const s of this.stars) { s.z -= this.speed * dt; if (s.z < 60) { s.z = 4000; s.x = rand(-1800, 1800); s.y = rand(-1400, 1400); } }
    for (const c of this.cl) { c.z -= this.speed * dt; if (c.z < 300) Object.assign(c, this.mkCloud(6500)); }
    if (this.over){ this.overT += dt; this.speed *= (1 - dt * 1.5); return; }
    this.run += dt;
    const tv = Math.min(520 + this.run * 9, 1300);
    this.boost = (keys.ShiftLeft || keys.ShiftRight || keys.Space || (ptr.touch ? touches >= 2 : touches > 0)) && this.energy > .02;
    this.energy = clamp(this.energy + (this.boost ? -.5 : .18) * dt, 0, 1);
    this.speed += (tv * (this.boost ? 1.6 : 1) - this.speed) * Math.min(1, dt * 3);
    this.F += ((this.boost ? 520 : 430) - this.F) * Math.min(1, dt * 4);
    const kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    const ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    let dvx = 0, dvy = 0;
    if (kx || ky){ const l = Math.hypot(kx, ky); dvx = kx / l * 650; dvy = ky / l * 650; }
    else if (ptr.active){
      const tx = (ptr.x - W / 2) / (W / 2) * RRX * 1.1, ty = (ptr.y - H * .5) / (H * .4) * RRY;
      dvx = clamp((tx - this.px) * 5, -700, 700); dvy = clamp((ty - this.py) * 5, -700, 700);
    }
    this.vx += (dvx - this.vx) * Math.min(1, dt * 8); this.vy += (dvy - this.vy) * Math.min(1, dt * 8);
    this.px = clamp(this.px + this.vx * dt, -RRX, RRX); this.py = clamp(this.py + this.vy * dt, -RRY, RRY);
    this.camx += (this.px * .5 - this.camx) * Math.min(1, dt * 5); this.camy += (this.py * .5 - this.camy) * Math.min(1, dt * 5);
    this.inv -= dt; this.time -= dt; this.score += this.speed * dt * .01;
    if (this.time <= 0) { this.time = 0; this.crash('TIME UP'); return; }
    // spawn
    const dz = this.speed * dt; this.spawnZ -= dz; this.lz -= dz;
    while (this.spawnZ < 7500){ this.spawnRing(this.spawnZ); this.spawnZ += rand(850, 1250); }
    // objects
    const pp = this.proj(this.px, this.py, RPZ);
    for (const o of this.objs){
      o.z -= dz;
      if (o.k === 'mine') o.rot += dt * 2;
      if (o.k === 'ring' && o.state === 1){ o.pt += dt; if (o.pt > .45) o.dead = true; }
      if (!o.done && o.z <= RPZ){
        o.done = 1;
        const d = Math.hypot(o.x - this.px, o.y - this.py);
        if (o.k === 'ring'){
          if (d < o.r * .88){
            o.state = 1; this.rings++; this.combo++;
            const perfect = d < o.r * .3, pts = Math.round(100 * (1 + Math.floor(this.combo / 3) * .5) * (perfect ? 2 : 1));
            this.score += pts; this.time = Math.min(60, this.time + 1.3 + (perfect ? .5 : 0));
            floatText(pp.x, pp.y - 60, (perfect ? 'PERFECT +' : '+') + pts, perfect ? '#ffd36b' : '#7dffa8', perfect ? 30 : 24);
            rings.push({ x: pp.x, y: pp.y, r: 10, mr: 220, life: .5, max: .5, w: 8, col: '#7dffa8' });
            rings.push({ x: pp.x, y: pp.y, r: 6, mr: 320, life: .35, max: .35, w: 3, col: '#ffffff' });
            spark(pp.x, pp.y, 24, '#9dffcb', 520); sfx.pick(); flash = Math.max(flash, .12); flashCol = '#7dffa8';
          } else {
            o.state = 2; this.miss++; this.combo = 0; this.time = Math.max(0, this.time - 4);
            floatText(pp.x, pp.y - 60, 'MISS  -4s', '#ff5a6a', 26); sfx.hit(); shake = Math.max(shake, 6);
          }
        } else if (o.k === 'mine'){
          if (d < o.r + 14 && this.inv <= 0){
            this.hp--; this.inv = 1.4; this.combo = 0; shake = 22; flash = .55; flashCol = '#ff2a3a'; sfx.hurt();
            boom(pp.x, pp.y, 1.6, '#ff7a4a'); o.dead = true;
            if (this.hp <= 0) this.crash('CRASHED');
          }
        } else if (o.k === 'orb'){
          if (d < o.r + 40){ o.dead = true; this.score += 25; this.time = Math.min(60, this.time + .3); spark(pp.x, pp.y, 8, '#8feaff', 300); snd('triangle', 900, 1400, .08, .04); }
        }
      }
    }
    this.objs = this.objs.filter(o => !o.dead && o.z > -100);
    // engine fx
    const flame = this.boost ? 3 : 2;
    for (let i = 0; i < flame; i++) addP({ type: 'fire', x: pp.x + rand(-5, 5), y: pp.y + 36, vx: rand(-20, 20), vy: rand(160, 300), life: .28, max: .28, size: rand(16, 28), drag: 1.5 });
    if (this.boost) { shake = Math.max(shake, 3); if (Math.random() < .6) addP({ type: 'spark', x: pp.x + rand(-30, 30), y: pp.y + rand(-10, 30), vx: rand(-60, 60), vy: rand(300, 600), life: .25, max: .25, col: '#9fe', drag: 1 }); }
  },
  draw(){
    const h = (205 + this.run * 3) % 360;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${h},65%,10%)`); g.addColorStop(.5, `hsl(${(h + 25) % 360},60%,30%)`); g.addColorStop(1, `hsl(${(h + 50) % 360},70%,48%)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const c0 = this.proj(0, 0, 8000);
    drawGlow('#ffcf8a', c0.x, c0.y, 800, 800, .5);
    // stars
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    for (const s of this.stars){
      const p1 = this.proj(s.x, s.y, s.z), p2 = this.proj(s.x, s.y, s.z + this.speed * .05);
      ctx.globalAlpha = clamp(1.2 - s.z / 4000, .05, .9); ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    // clouds (far → near)
    const cs = this.cl.slice().sort((a, b) => b.z - a.z);
    for (const c of cs){
      const p = this.proj(c.x, c.y, c.z), w = 900 * p.s; if (w > 1800) continue;
      ctx.globalAlpha = clamp(1.1 - c.z / 6500, .05, .45) * .8; ctx.drawImage(c.img, p.x - w / 2, p.y - w / 4, w, w / 2);
    }
    ctx.globalAlpha = 1;
    // speed lines
    const k = clamp((this.speed - 600) / 700, 0, 1);
    if (k > 0){
      ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = '#cfe8ff'; ctx.lineWidth = 2;
      for (let i = 0; i < 30; i++){
        const a = i * 2.399, u = (this.run * (1.2 + k) + i * .173) % 1, r0 = 120 + u * u * 600, r1 = r0 + 40 + k * 160 * u;
        ctx.globalAlpha = k * .35 * u; ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * r0, H / 2 + Math.sin(a) * r0 * 1.3); ctx.lineTo(W / 2 + Math.cos(a) * r1, H / 2 + Math.sin(a) * r1 * 1.3); ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    }
    // objects + plane in depth order
    const objs = this.objs.slice().sort((a, b) => b.z - a.z);
    let planeDrawn = false;
    for (const o of objs){
      if (!planeDrawn && o.z < RPZ){ this.drawPlane(); planeDrawn = true; }
      this.drawObj(o);
    }
    if (!planeDrawn) this.drawPlane();
    // guide arrow to next ring
    if (!this.over){
      let nr = null; for (const o of this.objs) if (o.k === 'ring' && o.z > RPZ && (!nr || o.z < nr.z)) nr = o;
      if (nr){
        const pp = this.proj(this.px, this.py, RPZ), rp = this.proj(nr.x, nr.y, nr.z), dx = rp.x - pp.x, dy = rp.y - pp.y, d = Math.hypot(dx, dy);
        if (d > 70){
          const a = Math.atan2(dy, dx); ctx.save(); ctx.translate(pp.x + Math.cos(a) * 85, pp.y + Math.sin(a) * 85); ctx.rotate(a);
          ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = '#7dffa8'; ctx.globalAlpha = .6 + .3 * Math.sin(t * 10);
          ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -9); ctx.lineTo(-3, 0); ctx.lineTo(-8, 9); ctx.closePath(); ctx.fill(); ctx.restore();
        }
      }
    }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  },
  drawPlane(){
    if (this.over && this.overT > .05 && this.why === 'CRASHED') return;
    const p = this.proj(this.px, this.py, RPZ), a = this.inv > 0 && Math.floor(t * 20) % 2 ? .4 : 1;
    ctx.globalAlpha = 1;
    drawJet(p.x, p.y, 1.15, clamp(this.vx / 650, -1, 1), 0, a, this.boost ? 1.9 : 1);
  },
  drawObj(o){
    if (o.z < 30) return;
    const p = this.proj(o.x, o.y, o.z), fog = clamp(1.25 - o.z / 7500, .12, 1);
    if (o.k === 'ring'){
      let rad = o.r * p.s, col = ['#4dffb0', '#4dd2ff', '#ffd24d'][o.c], al = fog;
      if (o.state === 1){ rad *= 1 + o.pt * 3.5; al *= clamp(1 - o.pt * 2.2, 0, 1); col = '#ffffff'; }
      if (o.state === 2){ col = '#ff4455'; al *= .6; }
      if (al <= 0) return;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      drawGlow(col, p.x, p.y, rad * 3, rad * 3, al * .25);
      ctx.globalAlpha = al; ctx.strokeStyle = col; ctx.lineWidth = Math.max(3, 16 * p.s);
      ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, TAU); ctx.stroke();
      ctx.lineWidth = Math.max(1, 4 * p.s); ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, TAU); ctx.stroke();
      ctx.setLineDash([rad * .22, rad * .18]); ctx.lineDashOffset = -t * rad * .6; ctx.lineWidth = Math.max(1.5, 5 * p.s); ctx.strokeStyle = col; ctx.globalAlpha = al * .7;
      ctx.beginPath(); ctx.arc(p.x, p.y, rad * 1.18, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
    } else if (o.k === 'mine'){
      const rad = o.r * p.s; ctx.save(); ctx.translate(p.x, p.y); ctx.globalAlpha = fog;
      ctx.globalCompositeOperation = 'lighter'; drawGlow('#ff3b3b', 0, 0, rad * 4 * (.8 + .2 * Math.sin(t * 8 + o.rot)), rad * 4 * (.8 + .2 * Math.sin(t * 8 + o.rot)), fog * .7);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = fog; ctx.rotate(o.rot);
      ctx.strokeStyle = '#c33'; ctx.lineWidth = Math.max(2, 7 * p.s);
      for (let i = 0; i < 8; i++){ const a = i / 8 * TAU; ctx.beginPath(); ctx.moveTo(Math.cos(a) * rad * .7, Math.sin(a) * rad * .7); ctx.lineTo(Math.cos(a) * rad * 1.35, Math.sin(a) * rad * 1.35); ctx.stroke(); }
      const gr = ctx.createRadialGradient(-rad * .3, -rad * .3, 0, 0, 0, rad); gr.addColorStop(0, '#6a6f80'); gr.addColorStop(1, '#171a24');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, rad, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ff4a4a'; ctx.beginPath(); ctx.arc(0, 0, rad * .22, 0, TAU); ctx.fill();
      ctx.restore();
    } else {
      const rad = o.r * p.s;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      drawGlow('#6fe7ff', p.x, p.y, rad * 3, rad * 3, fog * .9); drawGlow('#ffffff', p.x, p.y, rad * 1, rad * 1, fog);
      ctx.restore();
    }
  },
  hud(){
    txt(String(Math.round(this.score)).padStart(7, '0'), 18, 28, 30, '#fff', 'left');
    txt('BEST ' + String(Math.max(bestOf('ring'), Math.round(this.score))).padStart(7, '0'), 20, 54, 13, '#9fb6d8', 'left', '600');
    hpBar(this.hp, 3, W - 18, 20);
    txt('RINGS ' + this.rings, W - 18, 58, 16, '#7dffa8', 'right', '800');
    const low = this.time < 8, tc = low && Math.floor(t * 5) % 2 ? '#ff5a6a' : '#fff';
    txt(this.time.toFixed(1) + 's', W / 2, 40, 42, tc, 'center', '900');
    txt('TIME', W / 2, 66, 11, '#9fb6d8', 'center', '700');
    if (this.combo >= 2) txt(this.combo + ' COMBO', 18, 92, 24, `hsl(${(150 - this.combo * 6 + 360) % 360},100%,62%)`, 'left', '900');
    txt(Math.round(this.speed * .3) + ' km/h', 18, H - 52, 16, '#cfe3ff', 'left', '800');
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(18, H - 32, 140, 8);
    ctx.fillStyle = this.boost ? '#ffd36b' : '#4a8dff'; ctx.fillRect(18, H - 32, 140 * this.energy, 8);
    txt('BOOST [SHIFT / SPACE / 꾹 누르기]', 18, H - 14, 11, '#9fb6d8', 'left', '600');
    if (this.over) overlay(this.why, '#ff6b7f', ['SCORE  ' + Math.round(this.score), 'RINGS ' + this.rings + '  ·  MISS ' + this.miss], clamp((this.overT - 1) * 2, 0, 1));
  }
};

/* ---------- loop ---------- */
let last = performance.now();
parts = []; rings = []; texts = []; bullets = []; ebullets = []; enemies = []; pups = []; P = newPlayer();
function loop(now){
  const real = Math.min(.05, (now - last) / 1000); last = now;
  if (!paused){
    ts += (1 - ts) * Math.min(1, real * 1.6);
    const dt = real * ts; t += dt;
    if (scene === 'menu') { updateBg(dt); menuT += dt; }
    else if (scene !== 'striker') games[scene].update(dt);
    else { updateBg(dt);
    if (state === 'title'){
      if (Math.random() < .8) addP({ type: 'fire', x: W / 2 + Math.sin(t * 1.3) * 120, y: H * .66 + 50, vx: rand(-20, 20), vy: rand(150, 250), life: .35, max: .35, size: rand(20, 36), drag: 1 });
    } else updateGame(dt); }
    updateFx(dt);
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
